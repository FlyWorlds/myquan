name: Validate skill

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Check CLIs
        run: |
          python scripts/run_factor_selection.py --help
          python scripts/run_selection_backtest.py --help
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir /tmp/residual-skill-wheel .
      - name: Run deterministic Beam smoke test
        run: |
          python examples/generate_residual_search_toy_data.py
          python scripts/run_factor_selection.py --config examples/residual_search/toy_config.yaml run-beam
