name: quant-research-experiment-registry
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q scripts tests
      - name: Check release files
        run: test -s LICENSE && test "$(wc -c < LICENSE)" -ge 35000 && test -f README.md && test -f README.en.md && test -f HERMES.md && test -f agents/cursor-rule.mdc && test -f agents/portable-loader.md
      - name: Parse JSON examples and schemas
        run: python -c "import json, pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('.').rglob('*.json')]"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate qsh-form
        run: node scripts/validate-qsh-form.mjs SKILL.md
