[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-oil-brief"
version = "0.1.0"
description = "原油简报生成工具 — Crude Oil Briefing Skill"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.22,<2.0",
    "panda-data>=0.0.9",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
]

[project.scripts]
oil-brief = "oil_brief.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
