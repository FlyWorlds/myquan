server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: myquan-backend
  config:
    import: optional:file:./config/application-local.properties
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:myquan}?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: MyquanPool
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 3000
      connection-init-sql: SET time_zone = '+08:00'
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  jdbc:
    template:
      query-timeout: 5
  jackson:
    time-zone: Asia/Shanghai
    deserialization:
      use-big-decimal-for-floats: true
  lifecycle:
    timeout-per-shutdown-phase: 10s

myquan:
  holdings:
    path: ${HOLDINGS_FILE:../holdingStocks/holdings.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
